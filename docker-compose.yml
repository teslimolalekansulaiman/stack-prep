# Optional (ADR-0010). Local development normally uses the native services:
#   make db-start        PostgreSQL 18 on port 55439, data in .local/postgres
#   redis-server         Redis 8 on port 6379
# Use this file only if you prefer containers. Keep versions in step with production.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: scorepilot
      POSTGRES_PASSWORD: scorepilot
      POSTGRES_DB: scorepilot
    ports:
      - "55440:5432"   # different port so it cannot clash with the native cluster
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
