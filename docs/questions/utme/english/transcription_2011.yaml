- id: passage_2011_passage_i
  label: PASSAGE_I
  text: 'In 1962, a team of scientists produce a special radio station that had a range of fifteen miles.
    Even though communication was being accomplished in space at a range of more than a million times
    this distance, the new radio station caused much excitement among scientist. The reason: its power
    supply was ''battery'' made of bacteria. For a the first time, practical amounts of electricity were
    being produced by a form of life and put to use. Bio cell, the new power supply had a liquid fuel
    containing tiny forms of life that changed the fuel directly into electric energy; this was far more
    than an interesting ENGLISH QUESTIONS experiment. The bio cell is being develop as producers of electricity
    for radio, for signal to guide ship, for lighting and other uses. Though the working bio cell is only
    a few years old, some scientist feels that it will one day produce power cheaply as is now being done
    by other method, and that the bio cell will use materials that would otherwise be consider a waste.
    Early bio cells were powered with sugar, but a wide range of fuel can be used. Work is being done
    using sea water to feed the bacteria. Electricity from living cells is no new idea. Man experience
    the strange shock produce by some fish even before electricity was really discovered. Then in time,
    there were other discoveries. Benjamin Franklin found that lightening in the sky was electricity.
    Luigi Galvani found some electricity in the muscles and nerves of animals, but the African catfish
    produce far more electricity than most other living creatures. And other fish, the electric eel, well
    named, for it has an even greater electric charge. Research works also discovered that even humans
    produce small amount of electricity in their bodies. Our heart produces a very small amount that can
    be measured, so do our brain. The bio cell is completely new in the field of power production and
    as yet, no mass-production models have begun to replace the older type of batteries. Its might be
    wondered, then, what the excitement is all about'
- id: passage_2011_passage_ii
  label: PASSAGE_II
  text: Like a clock with the pendulum in full swing, the mind moves as fast as time. But we ought to
    mind our thoughts for if they turn to be our enemies, they will be too many for us and will drag us
    down to ruin. But some people may say that they cannot help having bad thought even though they sting
    like vipers. That may be so, but the question is, do they hate them or not? We cannot keep thieves
    from looking in at our window, but if we open our doors to them and receive them joyfully, we are
    as bad as they. We cannot help the birds flying over our head; but we may keep them from building
    their nets in our hair. Vain thought will knock at the door but we must not open to them. Though bad
    and evil thought rise in our hearts, they must not be allowed to reign. He who turns a morsel over
    and over in his mouth dose so because he likes the flavour, and he who meditate upon evil, love it,
    and is ripe to commit it. Think of the devil, and he will appear, turn your thought toward evil and
    your hands will soon follow. Snails leaves their slime behind them, and so do vain thought. An arrow
    may fly through the air, and leaves no trace, but an evil thought always leaves a trail like a serpent.
    Where there is much traffic of bad thinking, there will be much mire and dirt. Every wave of wicked
    thought adds something to the corruption which rots upon the shore of life. It is dreadful to think
    that a vile imagination, once indulge, gets the key of our minds, and can get in again very easily,
    whether or not we let it in, and what may follow, no one knows. Nurse evil on the laps of thought,
    and it will grow into a giant. Therefore; there is wisdom in watching every day, the thought and imagination
    of our heart. Good thoughts are blessed guest and should be welcome, and much sought after, but bad
    thought must fly out as swiftly as they moved in
- id: passage_2011_passage_iii
  label: PASSAGE_III
  text: Though assumption is the lowest level of knowledge; it is still a form of knowledge, and knowledge
    is key. Assumptions are the foundation upon which interpretation and conclusion are built. Everything
    in life operate under certain assumptions. We make management decisions based on the assumptions we
    hold about how management ought to function and how people ought to be governed. For some of us, we
    consciously imbibe assumptions and principles about life and consciously decide based on them; for
    others, it is unconsciously but potent all the same. Our assumptions will either drown us or help
    us soar through life. We have always seen life as an immense mansion with many rooms. Some rooms lead
    to wealth, others to the opposite. Ultimately, we decide where we end up; and life, thus far, has
    proved that not everyone of us decides well, we all behave differently where we have different levels
    of understanding, and behave the way where our understanding is the same. We eat because we all understand
    the consequences of not eating. We all wear clothes because each of us comprehends lunacy. The list
    goes on and on. It is inevitable that some of us will make choices that get and keep us on the lower
    rung of the ladder by reason of exposure, training or some others variables. Life is about role playing.
    We choose our roles wisely or foolishly, consciously or unconsciously. Some of us get wiser to new
    levels of self- awareness enough to redefine our roles, others make no effort to build further capacity
    and therefore remain where they are. It is based on those realities that we draw the conclusion that
    not everyone will be wealthy in life. We lead, inspire and motivate people to strive and succeed.
    It is also important that we paint the full and true picture of life so that we can discourage vain
    pursuits. Balance must be enthroned as a critical component of truth, and people know, for instance,
    that 'the top' is not a place that all must ascend. Our greatest consolation lies in our deep conviction
    that true prosperity is in fulfilment through hard work than in intangible acquisition. There are
    set roles that some of us have been wired up to play in life but which we are not content enough to
    play because society esteems such roles to be inferior. Take the almost scared office of a teacher
    for instance; there are people who have the natural gifts and inclinations to be school teacher. But
    teaching profession, as it is, does not appear to be lucrative. So we have people who could have been
    more fulfilled and effective working as school teacher serving in banks
