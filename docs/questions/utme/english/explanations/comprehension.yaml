# UTME Use of English — Comprehension (ENG.A.1.i), words in context (ENG.A.2.i) and
# reasoning (ENG.A.3.i)
#
# Every one of these is answered from the passage. The explanations therefore point at the
# part of the passage that settles it, rather than reasoning from general knowledge — which
# is the habit these questions are set to break.
format_version: 1
skill: ENG.A.1.i, ENG.A.2.i and ENG.A.3.i
explanations:
  04ace0b9:
    steps:
      - "The passage admits bad thoughts will come — we cannot keep thieves from looking in at our window — but insists we need not let them in."
      - "Evil thoughts may come but there is virtue in keeping them out states both halves. The other options take one image from the passage and turn it into a claim the writer never makes."
    hint: "The writer concedes something and then argues against it. Find the option that keeps both parts."
  ec5ba3b7:
    steps:
      - "The first paragraph says that if thoughts turn into our enemies they will drag us down to ruin — that is a warning about consequences."
      - "Too many evil thoughts leave fatal consequences says it. The option about stopping the pendulum reads the clock image as advice, which it is not."
    hint: "The pendulum is only a picture of how fast the mind moves. The claim is about what follows."
  46497607:
    steps:
      - "The second paragraph's test is whether we hate bad thoughts or welcome them: the man who turns a morsel over in his mouth does so because he likes the flavour."
      - "People who treasure and ruminate on them is that image in plain words."
    hint: "Find the sentence about rolling a morsel round the mouth. It is about dwelling on something on purpose."
  385904b6:
    steps:
      - "Think of the devil and he will appear is followed immediately by turn your thoughts toward evil and your hands will soon follow — thought leading to action."
      - "Uncontrolled evil thoughts may lead to evil deeds says it. The other options stop at the thought and never reach the hands."
    hint: "Read the sentence after the quoted one. It explains what the saying is being used for."
  765bc90e:
    steps:
      - "The fourth paragraph piles up images of accumulation: slime left behind, traffic making mire, every wave adding to the corruption."
      - "The more evil we think, the more vile we are likely to become is the argument those images make."
    hint: "The paragraph is about what builds up over time, not about any one thought."
  dedc0985:
    steps:
      - "The writer does not describe learning by experience neutrally — it is called tough, costly and inconvenient, and we are told to make a clean break with it."
      - "Critical is the word for that. Objective and non-committal would fit a writer who left the question open."
    hint: "Count the judgements the writer makes. A neutral writer makes none."
  f4defe44:
    steps:
      - "The whole passage argues that learning by wisdom is better and more convenient than learning by experience."
      - "Wise thoughts are more desirable than experience says it. Three options state the reverse of the writer's case."
    hint: "The question asks what can be deduced, and the passage argues one thing throughout."
  6134cc8a:
    steps:
      - "The passage says life is simply the outcome of decisions, and that our future will be determined by our decisions of today."
      - "The totality of our actions should be decided by our judgement is that claim. The others contradict the passage or reverse its argument."
    hint: "Find the sentence about decisions. It is the passage's central claim."
  3aec42a5:
    steps:
      - "The last paragraph says we must be disciplined to remain with our resolve to make a clean break with experience as our best teacher."
      - "The published key gives choosing the learning opportunity that comes our way; decide against making experience our teacher is what the passage actually says, and this question is flagged for a second look."
    hint: "Read the sentence containing the word disciplined and take what follows it."
  d1441964:
    steps:
      - "Wholehearted devotion is glossed by the passage itself: resolved, resolute and resilient, without detour."
      - "Acting without doubt is that meaning. The other options bring in pain, tension or teaching, none of which the phrase carries."
    hint: "The words around the phrase explain it. Look for resolute and resilient."
  de062722:
    steps:
      - "This asks which paper type the candidate was given. It is an instruction from the invigilator's page, not a question about English."
      - "It should have been rejected at import and is flagged for removal from the bank."
    hint: "Nothing in the passage bears on this. It is not an English question."
  e67a231f:
    steps:
      - "Electricity from living cells is no new idea is the writer stepping in to correct an assumption the reader might hold, and the paragraph then lists evidence for it."
      - "Contentious describes a writer arguing a point. Logical would describe the reasoning rather than the posture."
    hint: "Ask what the sentence is doing: stating a fact, or answering an objection?"
  03b65da7:
    steps:
      - "The passage says early bio cells were powered with sugar, but a wide range of fuel can be used."
      - "Bio cells at the beginning derived their energy from sugar is that sentence. The option pairing sugar and fuel adds something the passage does not say."
    hint: "Find the word sugar in the passage and read the sentence it is in."
  24d6a2cd:
    steps:
      - "The passage says some scientists feel it will one day produce power cheaply, and will use materials otherwise considered waste."
      - "Yield a source of energy without much spending is that claim. The options about all machines and all ships claim more than the passage does."
    hint: "The justification is about cost. Find the sentence with cheaply in it."
  f69a0cc4:
    steps:
      - "The passage says man experienced the strange shock produced by some fish even before electricity was really discovered."
      - "Fish came first — before Franklin's lightning and before Galvani's animals. That order is the answer."
    hint: "The paragraph gives a sequence. Read it from the beginning and take the first."
  442c47b2:
    steps:
      - "The passage opens with affluent living habits measured against income as an indicator of corruption."
      - "Unnecessary affluence is that. Public officers are who is corrupt, not what triggers it, which is the distinction the question turns on."
    hint: "The question asks what sets corruption off, not who commits it."
  4900c3b9:
    steps:
      - "The passage treats corruption as a brake on a country's development."
      - "It impedes the progress of a nation is the consequence stated. The other options describe benefits to individuals, which is not what the writer calls a consequence."
    hint: "The question asks about consequences for the nation, not for the corrupt."
  cb2d5eff:
    steps:
      - "The passage puts the duty of preventing corruption on government, as the body that sets and enforces standards."
      - "Corrupt public officers are the problem rather than the remedy, and lawyers and police are instruments rather than the responsible party."
    hint: "Find where the passage says whose job prevention is."
  0486f4e7:
    steps:
      - "Democratic governance is named in the passage as the mark of ethical standards in government."
      - "Bloated expenditure and socio-economic instability are symptoms of the opposite."
    hint: "Three of these options describe problems. Only one describes a standard being met."
  fec7bc46:
    steps:
      - "The passage's argument is that fighting corruption is worth doing because of what it makes possible, not because of who it punishes."
      - "Promote good governance is that purpose. Sending people to jail and punishing politicians are means, not the essence."
    hint: "The word essence asks for the purpose, not the method."
  d2ebaccb:
    steps:
      - "To relate to something experimentally is to know it by having gone through it, which is why the passage says studying stress yields personal as well as professional benefit."
      - "It is better understood when experienced says that. Everybody encounters it is true but is not what the phrase means."
    hint: "The question asks what the expression means, not whether the statement is true."
  979131a1:
    steps:
      - "The passage says most stress is self-generated, and that because we cause most of our own we can do something about it."
      - "Stress is better handled by the individual follows from that. The published key gives the relaxation option, which the passage does not support, and this question is flagged for a second look."
    hint: "Find the sentence about who causes most stress. The answer follows from it."
  eaab1bc4:
    steps:
      - "The passage states the premise plainly: to master stress, figure out what you are doing that contributes to the problem, and change it."
      - "Changing one's attitude to stressors is that step. Doctors and exercise are not what the passage names."
    hint: "The last sentence of the extract gives the method in one line."
  722c4e41:
    steps:
      - "Experts say we create the majority of our own upset, which is precisely why we have a measure of control."
      - "It is individually initiated is that reason. The other options give effects rather than the reason given."
    hint: "The passage links control to cause. Find the sentence that does so."
  a3b9f1eb:
    steps:
      - "Since most stress is self-generated, the passage treats it as something people bring on themselves."
      - "Individually induced problems is the deduction. The options about bodily reactions describe symptoms rather than what stress is said to be."
    hint: "The question says deduced, so take the passage's central claim and state it generally."
  67aa6a9a:
    steps:
      - "The writer says the outstandingly important fact about Spaceship Earth is that no instruction book came with it."
      - "Has no instruction manual is that fact. The published key gives an option about ease of operation, and the passage argues the opposite; this question is flagged for a second look."
    hint: "Find the sentence beginning Now there is one outstanding important fact."
  44cbdad0:
    steps:
      - "Lacking instructions, people had to work out which mangoes were safe, and so devised experimental procedures."
      - "Challenged man's inquisitiveness is that outcome. Made man helpless is the reverse of what the passage describes."
    hint: "The missing manual had a consequence the writer treats as good. What was it?"
  fa162cd8:
    steps:
      - "The passage describes people forced to experiment, interpret findings and go on doing so."
      - "By his nature is in constant search of knowledge is the deduction. Learns by chance contradicts the emphasis on deliberate method."
    hint: "The writer treats the missing manual as purposeful. What does that say about people?"
  e196ca0a:
    steps:
      - "The writer neither laments the missing manual nor celebrates it; the passage explains what followed from it and leaves the judgement open."
      - "Non-committal fits. Pessimism and frustration would need complaints the passage does not make."
    hint: "Count the writer's complaints and the writer's boasts. If there are neither, the mood is neutral."
  0de3f133:
    steps:
      - "This question depends on a part of the passage the extraction did not capture — the text stops before the section on leading and motivating others."
      - "It is flagged as unanswerable from the passage as stored, and needs the full text restored before it can be used."
    hint: "The passage as printed here does not reach this point."
  d2af344f:
    steps:
      - "This question refers to a sentence about balance that the stored passage does not contain — the extract is cut short."
      - "It is flagged as unanswerable from the passage as stored."
    hint: "The passage as printed here does not reach this point."
  313bc340:
    steps:
      - "The passage says we behave differently where our understanding differs, and the same where it is the same, giving eating and clothing as examples."
      - "People do certain things in life because they know the repercussion states that, and is the better answer; the published key gives an option about visible acquisition, and this question is flagged for a second look."
    hint: "Find the sentences about eating and wearing clothes. They are given as examples of a rule."
  62e44c75:
    steps:
      - "The passage says some of us consciously imbibe assumptions and decide based on them, while for others it is unconscious."
      - "People make conscious effort to acquire hidden knowledge is the inference the key takes. The option claiming all managerial decisions rest on assumptions overstates a passage that says some do."
    hint: "Watch the words all and some. An option that says all is usually too strong for a passage that says some."
  9636281c:
    steps:
      - "The passage says our response to a performance is subjective and that even professional critics differ strongly."
      - "The published key gives an option about evaluation performance, which the passage does not state; music influences feelings at different levels is what the passage supports. This question is flagged for a second look."
    hint: "Find the sentence about critics disagreeing. What does it say about how people respond?"
  908df961:
    steps:
      - "The passage says feelings are exchanged between stage and hall — the stage is where the artiste is and the hall is where the listeners are."
      - "Artiste and the audience is that. Producer and director are not in the passage at all."
    hint: "Ask who stands on a stage and who sits in a hall."
  46a3118f:
    steps:
      - "The passage lists where music is heard — auditoriums, homes, elevators, cars, jogging paths — and says these can function as new kinds of concert halls."
      - "Appreciated as the environment dictates follows from that. The other options add preferences the passage never states."
    hint: "The passage spends a paragraph on places. That is what the deduction is built from."
  14de4f81:
    steps:
      - "Live performance is special because feelings are exchanged between stage and hall and the listeners are actively involved."
      - "Interactive is that in one word. Error-free is the reverse — the passage says the artiste is putting himself on the line."
    hint: "Find the phrase actively involved. It is the reason the question asks for."
  9a3a3ad8:
    steps:
      - "The passage opens by saying good music provides entertainment and emotional release."
      - "Music provides enjoyment and relief is that sentence in other words. The CD and stage options describe how music reaches people, not why it matters."
    hint: "The answer is in the first two sentences. Read them before the options."
  d8c3da28:
    steps:
      - "This asks which question paper type the candidate was given. It is an invigilator's instruction, not an English question."
      - "It is flagged for removal from the bank; the import filter that catches these missed it."
    hint: "Nothing in the passage bears on this."
  ec17aebb:
    steps:
      - "The passage describes traditional religions that differ from group to group while sharing features — deities, divination, sacrifice."
      - "Different traditional religions with some elements of similarities keeps both halves. The options claiming they are completely different or entirely the same each drop one half."
    hint: "The passage says two things at once. The answer has to say both."
  88071d57:
    steps:
      - "The first paragraph describes a belief that events in the natural world are governed by supernatural forces."
      - "The supernatural world controls the natural world is that belief. Co-exist is too weak — it leaves out the governing."
    hint: "Ask not whether both worlds exist, but which one is said to be in charge."
  c9f9cdd5:
    steps:
      - "The passage attributes the decline of traditional religion to the spread of Christianity and Islam."
      - "The influence of non-traditional religions covers both, which is why it is the key rather than either one on its own."
    hint: "Two religions are named. Look for the option that includes both."
  adf2cec2:
    steps:
      - "Divination is named in the passage as a practice found across the traditional religions described."
      - "The options saying prayer only and sacrifice only add a restriction the passage does not make."
    hint: "The word only in two of these options is doing a lot of work. Check whether the passage supports it."
  6d172304:
    steps:
      - "Another paper-type instruction rather than an English question, and flagged for removal."
      - "Questions like this appear at the head of several papers and the import filter should catch them."
    hint: "Nothing in the passage bears on this."
  3542b97a:
    steps:
      - "The passage treats political and social change as something that happens whether or not anyone wants it."
      - "The published key gives invaluable; inevitable is what the passage argues, and the two words differ by one letter and by everything else. This question is flagged for a second look."
    hint: "Inevitable means unavoidable; invaluable means priceless. Decide which the passage is claiming."
  1e9b4882:
    steps:
      - "The passage treats political change and social transformation together throughout, each driving the other."
      - "Intertwined is that relation. Independent and antithetical both say they are separate or opposed."
    hint: "The passage never separates the two. What does that imply about how they relate?"
  3e1ad4d6:
    steps:
      - "The passage is about how social change and the winning of political power act on each other."
      - "Social change and political empowerment names both halves. The other titles cover only part of what the passage discusses."
    hint: "A good title covers the whole passage, not its first paragraph."
  89410048:
    steps:
      - "Alteration means a change made to something — a modification."
      - "Multiplication, recognition and complication are unrelated, and all four options share the same ending, which is the only reason they are together."
    hint: "The four options rhyme. That is a distraction; think about the meaning of the stem word alone."
  0dc9fcf6:
    steps:
      - "A third party in a conflict is someone outside it who comes between the two sides."
      - "Mediator is that role. An intruder also comes from outside but is unwanted, which is not what conflict management means by the phrase."
    hint: "Who is the third, if the two parties are the ones in dispute?"
  5d03bdaa:
    steps:
      - "The passage says the approach taken depends on the situation, so a nation sues for peace when its circumstances push it that way."
      - "The options beginning with all are too strong for a passage built on it depends."
    hint: "Any option saying all nations is claiming more than a passage about varying approaches can support."
  91df070f:
    steps:
      - "The passage's argument is that no single approach fits every conflict."
      - "The approach depends on the state of affairs is that. The option saying only one approach applies everywhere is its direct reverse."
    hint: "The passage opens by saying there are many approaches. What follows from that?"
  26b32ca9:
    steps:
      - "The approaches are described as the basic kinds from which conflict management is built."
      - "Fundamental says that. Pernicious and misleading would be criticisms the passage does not make."
    hint: "Ask whether the passage is praising, criticising or simply classifying."
  de6296c9:
    steps:
      - "The utility of an approach is how useful it is in a given case."
      - "Usefulness is the plain word. Management is the subject rather than the meaning of the word."
    hint: "Utility and useful share a root."
  54bbdc17:
    steps:
      - "To couch something in a language is to express it in that language."
      - "Expressed is the meaning. Arranged and itemized describe ordering rather than wording."
    hint: "Couched in is nearly always followed by words about how something was put."
  1bf7f3f9:
    steps:
      - "The passage argues that a people's language carries their culture and their way of seeing the world."
      - "The published key gives the claim that language is a society's only authority, which is stronger than the passage; language and culture are interwoven is what it supports. This question is flagged for a second look."
    hint: "Watch for the word only. It usually marks an option that goes further than the passage."
  87c120d8:
    steps:
      - "The passage treats the native language as the medium through which the world is understood."
      - "Our native language is as important as the world around us is the inference the key takes from that."
    hint: "The passage links language and understanding of the world. The answer connects those two things."
  86cc039c:
    steps:
      - "A native language marks a society off from its neighbours as well as binding it together — that is what symbolic means here."
      - "It distinguishes that society from others is the symbolic function. Promoting understanding within the group is the practical one."
    hint: "The question asks for the symbolic function, not the useful one."
  63a9deb7:
    steps:
      - "If language carries culture and understanding, then teaching in a child's own language follows."
      - "The language of instruction is ideally one's own language is that implication. The options saying no foreign language should be taught go further than the passage."
    hint: "The word ideally matters. An option saying never or no society is claiming more."
  72902cc2:
    steps:
      - "The passage stresses variety: over two thousand five hundred species, more than ten families, habitats from burrows to treetops to ocean depths."
      - "Heterogeneous means made of different kinds, which is exactly that. Homogeneous is its opposite."
    hint: "The passage counts species and lists habitats. What is it emphasising?"
  a41ed5a8:
    steps:
      - "The passage says snakes owe much of their success to their versatility, and spends its longest paragraph on where they live."
      - "The published key gives an option about Gombe and Plateau states, which is a detail from the last line; versatility is what the passage calls most notable. This question is flagged for a second look."
    hint: "Find the word success in the passage and read what is given as its cause."
  9312117b:
    steps:
      - "The passage says the only places without snakes are parts of the Polar Regions and isolated islands."
      - "Snakes are not in the polar region follows. The option about Ireland says the opposite of the passage, which names it as snake-free."
    hint: "Read the last sentence of the passage carefully; it lists the exceptions."
  579e9b76:
    steps:
      - "This asks about auditory, locomotive and visual organs, none of which the stored passage mentions — the extract does not reach that material."
      - "It is flagged as unanswerable from the passage as stored."
    hint: "The passage as printed here does not discuss the snake's senses or limbs."
  b8f6226b:
    steps:
      - "The passage covers feeding, temperature regulation, jaws, numbers and range — several characteristics rather than one."
      - "Some characteristics of snakes covers that. Feeding habits and species in Nigeria each name only one part."
    hint: "A title must cover the whole passage. Check each option against the last paragraph as well as the first."
