# UTME Use of English syllabus — draft seed data for database/migrations/001_curriculum.sql
#
# Extracted from "docs/syllabus/utme-english-syllabus 2027.pdf" (5 PDF pages; the syllabus
# body is pages 1–3, and pages 4–5 are the recommended-texts list). Everything here is a
# DRAFT. Nothing is approved.
#
# Mapping used:
#   * topic     = a printed section (A Comprehension and Summary, B Lexis and Structure,
#                 C Oral Forms)
#   * subtopic  = a printed content line inside that section
#   * skill     = a printed objective ("Candidates should be able to: i. ...")
#
# Where this document differs from the Mathematics syllabus, and what that forced:
#
#   1. Its objectives are printed PER SECTION, not per content line. So each objective is
#      attached to the content line it plainly concerns, and content lines the objectives
#      never reach (the reading text, summary, cloze, word classes, concord, word stress,
#      emphatic stress) carry a skill marked `syllabus_status: implied`. Those eight items
#      are OUR reading, not the Board's sentence; the loader records each as an
#      academic_boundary decision with a rationale, so a reviewer sees every one of them.
#      Items without that flag are the examiner's own wording.
#
#   2. Objective B.ii ("determine similar and opposite meanings of words") covers two
#      printed content lines, synonyms and antonyms, which the examination tests as separate
#      five-question parts. It is therefore split across the two, each citing the whole
#      objective. The split is the only judgement; both halves are printed.
#
#   3. Section A's printed content list — description, narration, exposition,
#      argumentation/persuasion — names the kinds of passage that may be set, not things a
#      candidate is asked to do. They are recorded on the topic as boundary_notes rather
#      than imported as subtopics, since a question is never "on narration".
#
#   4. Unlike Mathematics, this syllabus DOES state the structure of the paper (page 3:
#      60 questions, itemised). That is loaded separately, by
#      database/seeds/utme_use_of_english_paper_structure.sql, because it describes the
#      examination rather than the curriculum.
#
#   5. The document prints no year or edition anywhere in its body — the filename claims
#      2027, the file does not — so the version is `utme-undated` and document_year is null.
#      Its page numbers (198–202) show it is an extract from a larger brochure.
#
#   6. Source typography is kept verbatim in excerpts, including "monothongs" for
#      monophthongs and "5questions". The item names read correctly.

format_version: 1

