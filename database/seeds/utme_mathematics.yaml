# UTME Mathematics syllabus — draft seed data for database/migrations/001_curriculum.sql
#
# Extracted from docs/syllabus/utme-Mathematics.pdf (PDF pages 1–5; page 6 is the
# recommended-texts list). Everything here is a DRAFT. Nothing is approved; a reviewer must
# approve rows in the order described in docs/syllabus-database.md.
#
# Mapping used, which this syllabus makes unusually clean:
#   * topic     = a numbered SECTION (I–V)
#   * subtopic  = a numbered topic inside a section, with its lettered contents recorded in
#                 boundary_notes
#   * skill     = one printed objective ("Candidates should be able to: i. …"). These are the
#                 syllabus's own statements of what a candidate must do, so they are imported
#                 as skills verbatim rather than being invented.
#
# Loader conventions (identical to the other seeds):
#   * `parent` is the parent item's code; the loader resolves it to parent_id.
#   * display_order = position among siblings in this file, starting at 1.
#   * `location` + `excerpt` become one curriculum_evidence row.
#   * Excerpts are the source wording with line breaks joined and PDF artefacts fixed
#     (e.g. "1050" -> "105º", "bar chat" -> "bar chart" is NOT fixed — see note 3).
#
# Extraction judgements, for the reviewer:
#   1. The document itself prints no year, edition or version identifier anywhere. It is the
#      2027 syllabus on the authority of the person who supplied it, and that is what the
#      version label records. `authority_identifier` stays null and `document_year` stays
#      null, because those describe what the document says, and it says nothing.
#   2. The document does not state the examination's paper structure (how many questions, how
#      long, how many marks). Nothing about paper structure is recorded from it.
#   3. Typographic errors in the source are kept verbatim in excerpts: "bar chat" (page 5),
#      "cylinders. cones" (page 4), "1050" for 105º (page 4). The skill names read correctly.
#   4. Section IV numbers its first subtopic "I." and the next two "2." and "3."; the numbering
#      is normalised to 1, 2, 3 in the codes and noted here.

format_version: 1

