unmapped:
  general_objectives:
    source_location: PDF page 1, "GENERAL OBJECTIVES"
    aims:
      - acquire computational and manipulative skills
      - develop precise, logical and formal reasoning skills
      - develop deductive skills in interpretation of graphs, diagrams and data
      - apply mathematical concepts to resolve issues in daily living
    note: >-
      Four stated aims of the syllabus. They describe its purpose rather than assessable
      units, so they are not imported as curriculum items.
  paper_structure:
    note: >-
      This document does not state how many questions the paper has, how long it lasts or
      how it is marked. Nothing about paper structure is recorded from it; exam_papers rows
