# NECO GCE Mathematics syllabus — draft seed data for database/migrations/001_curriculum.sql
#
# Extracted from docs/Math-syllabus.pdf (Chapter Two, PDF pages 8–13; grading from page 15).
# Everything here is a DRAFT. Nothing is approved; a reviewer must approve rows in the
# order described in docs/syllabus-database.md.
#
# Loader conventions (so rows below stay short):
#   * Every curriculum item gets the values in `item_defaults` unless it overrides them.
#   * `parent` is the parent item's code; the loader resolves it to parent_id.
#   * display_order = position among siblings in this file, starting at 1.
#   * `location` + `excerpt` become one curriculum_evidence row:
#       evidence_kind = inclusion, source_document = the syllabus document below,
#       source_location = location, source_excerpt = excerpt, review_status = pending.
#   * Excerpts are the source wording with line breaks joined and PDF text artefacts
#     fixed (e.g. "10k" -> "10^k", "360o" -> "360°", "ax2" -> "ax²").
#   * Codes follow the syllabus numbering: MATH.<topic>.<subtopic>.<point>. Points shown
#     with a dash in the source are numbered i, ii, iii in order of appearance.

format_version: 1

validation:
  source_page_range: [8, 13]     # Chapter Two, the only pages this extraction may cite
  expected_topic_count: 9

examination:
  # Product target; the third-party PDF itself does not establish the exact external track.
  name: NECO Senior School Certificate Examination (External) — GCE
  short_name: SSCE_EXT
  exam_body: National Examinations Council (NECO)
  country_code: NG
  description: >-
    Senior School Certificate Examination for external (private) candidates,
    commonly called NECO GCE.
  status: draft
  grading_system:              # source claim only; loader does not publish this as verified grading
    source_location: PDF pages 15–16, Chapter Four "NECO Grading System"
    bands:
      - { min: 75, max: 100, grade: A1, remark: Excellent }
      - { min: 70, max: 74, grade: B2, remark: Very Good }
      - { min: 65, max: 69, grade: B3, remark: Good }
      - { min: 60, max: 64, grade: C4, remark: Credit }
      - { min: 55, max: 59, grade: C5, remark: Credit }
      - { min: 50, max: 54, grade: C6, remark: Credit }
      - { min: 45, max: 49, grade: D7, remark: Pass }
      - { min: 40, max: 44, grade: E8, remark: Pass }
      - { min: 0, max: 39, grade: F9, remark: Fail }

