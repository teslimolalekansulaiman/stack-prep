# WAEC English Language syllabus (2027) — draft seed data for database/migrations/001_curriculum.sql
#
# Extracted from "docs/syllabus/waec - English 2027.pdf" (PDF pages 2–9; the aims and the
# examination scheme on page 1 are recorded under `unmapped`, not as curriculum items).
# Everything here is a DRAFT. Nothing is approved; a reviewer must approve rows in the
# order described in docs/syllabus-database.md.
#
# Loader conventions (identical to the NECO seed):
#   * Every curriculum item gets `item_defaults` unless it overrides them.
#   * `parent` is the parent item's code; the loader resolves it to parent_id.
#   * display_order = position among siblings in this file, starting at 1.
#   * `location` + `excerpt` become one curriculum_evidence row.
#   * A subtopic with `syllabus_status: implied` is a structural container this schema
#     needs but the document does not print; it is recorded as an academic_boundary
#     decision, not as syllabus inclusion.
#   * Excerpts are the source wording with line breaks joined.
#
# Known extraction judgements, for the reviewer:
#   1. The document is organised by paper (1, 2, 3), not by topic. Topics below follow the
#      named sections of each paper: Lexis, Structure, Essay Writing, Comprehension,
#      Summary and Oral English.
#   2. Comprehension and Summary print a list of tested abilities with no named middle
#      level, so one structural subtopic is added to each.
#   3. Paper 3 has two alternatives. Nigeria and Liberia take the Test of Orals; Ghana,
#      The Gambia and Sierra Leone take Listening Comprehension. Both are recorded; the
#      alternative that does not apply to Nigerian candidates carries a boundary note.

format_version: 1

validation:
  source_page_range: [2, 9]      # syllabus content; page 1 is aims and examination scheme
  expected_topic_count: 6

examination:
  # Product target. The document does not state which WASSCE track (school candidates or
  # private candidates) it governs, so the track is not claimed here.
  name: West African Senior School Certificate Examination (WASSCE)
  short_name: WASSCE
  exam_body: West African Examinations Council (WAEC)
  country_code: NG
  description: >-
    WAEC 2027 syllabus, written for candidates in The Gambia, Ghana, Liberia, Nigeria and
    Sierra Leone. Our target market is Nigeria; country-specific papers are marked in the
    items below. The document does not state the examination track.
  status: draft

subject:
  code: ENG
  name: English Language
  status: draft

