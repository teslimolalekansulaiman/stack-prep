# Content from the document that has no table in the current schema.
unmapped:
  paper_structure:
    source_location: PDF page 1, examination scheme
    papers:
      - code: P1
        format: multiple_choice
        questions: 80
        answer: all
        duration_minutes: 60
        marks: 40
        options_per_question: 4
        description: >-
          Forty lexical and forty structural questions, each with four options lettered
          A to D. For candidates in The Gambia, Nigeria, Sierra Leone and Liberia only.
      - code: P2
        format: essay_and_passages
        duration_minutes: 120
        marks: 100
        sections:
          - code: A
            name: Essay writing
            questions: 5
            answer: 1
            marks: 50
            minutes: 50
            minimum_words: 450
          - code: B
            name: Comprehension
            questions: null
            answer: all
            marks: 20
            minutes: 30
            passage_minimum_words: 350
          - code: C
            name: Summary
            questions: null
            answer: all
            marks: 30
            minutes: 40
            passage_words: 500
      - code: P3
        format: multiple_choice
        questions: 60
        answer: all
        duration_minutes: 45
        marks: 30
        description: >-
          Test of Orals for candidates in Nigeria and Liberia; Listening Comprehension
          Test for candidates in Ghana, The Gambia and Sierra Leone.
  aims:
    source_location: PDF page 1, objectives (i)–(xii)
    note: >-
      Twelve stated abilities the examination sets out to measure. They describe the
      examination's purpose rather than assessable units, so they are not imported as
      curriculum items.

