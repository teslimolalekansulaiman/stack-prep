# WAEC General Mathematics syllabus (2027) — draft seed data for database/migrations/001_curriculum.sql
#
# Extracted from "docs/syllabus/waec -Mathematics 2027.pdf", section 2 "DETAILED SYLLABUS"
# (PDF pages 1–18). Pages 19–29 restate the same content as a TOPICS/CONTENTS/NOTES table;
# pages 29–31 hold units, currencies and other information. Only the prose section is
# imported, so no content is counted twice.
#
# Everything here is a DRAFT. Nothing is approved; a reviewer must approve rows in the
# order described in docs/syllabus-database.md.
#
# Loader conventions (identical to the NECO seed):
#   * Every curriculum item gets `item_defaults` unless it overrides them.
#   * `parent` is the parent item's code; the loader resolves it to parent_id.
#   * display_order = position among siblings in this file, starting at 1.
#   * `location` + `excerpt` become one curriculum_evidence row.
#   * Excerpts are the source wording with line breaks joined and PDF text artefacts
#     fixed: the export writes LaTeX fragments such as "a\(^x\)" and "\(\frac{1}{x}\)",
#     which are rendered here as a^x and 1/x.
#
# Known extraction judgements, for the reviewer:
#   1. Topic letters follow the summary table on PDF pages 19–29. The first topic prints
#      as "NUMBER AND NUMERATION" without its letter in the prose section; the table shows
#      it as A.
#   2. MATH.B.f (Graphs of Linear and Quadratic functions) prints the same three Contents
#      lines as MATH.B.g (Linear Inequalities). The printed wording is imported as-is and
#      flagged; its Notes describe graph work, so the source appears to have an error.
#   3. MATH.D.c and MATH.G.a each print one Contents line twice. The duplicate is imported
#      once and noted.
#   4. Some items in the summary table carry an asterisk. The document prints no legend
#      for it, so it is not interpreted here.

