curriculum_items:
  # ─────────────────────── A NUMBER AND NUMERATION ───────────────────────
  - code: MATH.A
    type: topic
    name: Number and Numeration
    location: PDF page 1, section 2
    excerpt: "NUMBER AND NUMERATION"

  - code: MATH.A.a
    parent: MATH.A
    type: subtopic
    name: Number bases
    location: PDF page 1, A(a)
    excerpt: "(a) Number bases"
  - code: MATH.A.a.i
    parent: MATH.A.a
    type: skill
    name: Convert numbers from one base to another
    location: PDF page 1, A(a)(i)
    excerpt: "conversion of numbers from one base to another"
    boundary_notes: "Conversion from one base to base 10 and vice versa; conversion from one base to another base."
  - code: MATH.A.a.ii
    parent: MATH.A.a
    type: skill
    name: Perform basic operations on number bases
    location: PDF page 1, A(a)(ii)
    excerpt: "Basic operations on number bases"
    boundary_notes: "Addition, subtraction, and multiplication of number bases."

  - code: MATH.A.b
    parent: MATH.A
    type: subtopic
    name: Modular Arithmetic
    location: PDF page 2, A(b)
    excerpt: "(b) Modular Arithmetic"
  - code: MATH.A.b.i
    parent: MATH.A.b
    type: skill
    name: Interpret the concept of modulo arithmetic
    location: PDF page 2, A(b)(i)
    excerpt: "Concept of Modulo Arithmetic."
    boundary_notes: "Interpretation of modulo arithmetic e.g. 6 + 4 = k(mod 7), 3 x 5 = b(mod 6), m = 2(mod 3), etc."
  - code: MATH.A.b.ii
    parent: MATH.A.b
    type: skill
    name: Add, subtract and multiply in modulo arithmetic
    location: PDF page 2, A(b)(ii)
    excerpt: "Addition, subtraction, and multiplication operations in modulo arithmetic."
  - code: MATH.A.b.iii
    parent: MATH.A.b
    type: skill
    name: Apply modulo arithmetic to daily life
    location: PDF page 2, A(b)(iii)
    excerpt: "Application to daily life"
    boundary_notes: "Relate to market days, clock, shift duty, etc."

  - code: MATH.A.c
    parent: MATH.A
    type: subtopic
    name: Fractions, Decimals and Approximations
    location: PDF page 2, A(c)
    excerpt: "(c) Fractions, Decimals, and Approximations"
  - code: MATH.A.c.i
    parent: MATH.A.c
    type: skill
    name: Perform basic operations on fractions and decimals
    location: PDF page 2, A(c)(i)
    excerpt: "Basic operations on fractions and decimals."
  - code: MATH.A.c.ii
    parent: MATH.A.c
    type: skill
    name: Use approximations and significant figures
    location: PDF page 2, A(c)(ii)
    excerpt: "Approximations and significant figures."
    boundary_notes: "Approximations should be realistic, e.g. a road is not measured correctly to the nearest cm."

  - code: MATH.A.d
    parent: MATH.A
    type: subtopic
    name: Indices
    location: PDF page 2, A(d)
    excerpt: "(d) Indices"
  - code: MATH.A.d.i
    parent: MATH.A.d
    type: skill
    name: Apply the laws of indices
    location: PDF page 3, A(d)(i)
    excerpt: "Laws of indices"
    boundary_notes: "e.g. a^x x a^y = a^(x+y), a^x ÷ a^y = a^(x-y), (a^x)^y = a^(xy), where x, y are real numbers and a ≠ 0. Include simple examples of negative and fractional indices."
  - code: MATH.A.d.ii
    parent: MATH.A.d
    type: skill
    name: Write numbers in standard form
    location: PDF page 3, A(d)(ii)
    excerpt: "Numbers in standard form ( scientific notation)"
    boundary_notes: "Expression of large and small numbers in standard form, e.g. 375300000 = 3.753 x 10^8, 0.00000035 = 3.5 x 10^-7. Use of tables of squares, square roots, and reciprocals is accepted."

  - code: MATH.A.e
    parent: MATH.A
    type: subtopic
    name: Logarithms
    location: PDF page 3, A(e)
    excerpt: "(e) Logarithms"
  - code: MATH.A.e.i
    parent: MATH.A.e
    type: skill
    name: Relate indices and logarithms
    location: PDF page 3, A(e)(i)
    excerpt: "Relationship between indices and logarithms, e.g. y = 10^k implies log_10 y = k."
  - code: MATH.A.e.ii
    parent: MATH.A.e
    type: skill
    name: Apply the basic rules of logarithms
    location: PDF page 3, A(e)(ii)
    excerpt: "Basic rules of logarithms e.g. log_10(pq) = log_10 p + log_10 q, log_10(p/q) = log_10 p – log_10 q, log_10 p^n = n log_10 p."
  - code: MATH.A.e.iii
    parent: MATH.A.e
    type: skill
    name: Use tables of logarithms and anti-logarithms
    location: PDF page 3, A(e)(iii)
    excerpt: "Use of tables of logarithms and anti-logarithms."
    boundary_notes: "Calculations involve multiplication, division, powers, and roots."

  - code: MATH.A.f
    parent: MATH.A
    type: subtopic
    name: Sequence and Series
    location: PDF page 3, A(f)
    excerpt: "(f) Sequence and Series"
  - code: MATH.A.f.i
    parent: MATH.A.f
    type: skill
    name: Identify patterns of sequences
    location: PDF page 3, A(f)(i)
    excerpt: "Patterns of sequences."
    boundary_notes: "Determine any term of a given sequence. The notation Un = the nth term of a sequence may be used."
  - code: MATH.A.f.ii
    parent: MATH.A.f
    type: skill
    name: Work with arithmetic and geometric progressions
    location: PDF page 3, A(f)(ii)
    excerpt: "Arithmetic progression (A.P.) Geometric Progression (G.P.)"
    boundary_notes: "Simple cases only, including word problems. Include sum for A.P. and exclude sum for G.P."

  - code: MATH.A.g
    parent: MATH.A
    type: subtopic
    name: Sets
    location: PDF page 4, A(g)
    excerpt: "(g) Sets"
  - code: MATH.A.g.i
    parent: MATH.A.g
    type: skill
    name: Use set ideas and notation
    location: PDF page 4, A(g)(i)
    excerpt: "Idea of sets, universal sets, finite and infinite sets, subsets, empty sets, and disjoint sets. Idea of and notation for union, intersection and complement of sets."
    boundary_notes: "Notations: ℰ, ⊂, ∪, ∩, { }, ∅, P' (the complement of P). Properties, e.g. commutative, associative, and distributive."
  - code: MATH.A.g.ii
    parent: MATH.A.g
    type: skill
    name: Solve classification problems using Venn diagrams
    location: PDF page 4, A(g)(ii)
    excerpt: "Solution of practical problems involving classification using Venn diagrams."
    boundary_notes: "Use of Venn diagrams restricted to at most 3 sets."

  - code: MATH.A.h
    parent: MATH.A
    type: subtopic
    name: Logical Reasoning
    location: PDF page 4, A(h)
    excerpt: "(h) Logical Reasoning"
  - code: MATH.A.h.i
    parent: MATH.A.h
    type: skill
    name: Work with simple statements, negation and implication
    location: PDF page 4, A(h)
    excerpt: "Simple statements. True and false statements. Negation of statements, implications."
    boundary_notes: "Use of symbols: ⟹, ⇐, use of Venn diagrams."

  - code: MATH.A.i
    parent: MATH.A
    type: subtopic
    name: Positive and negative integers, rational numbers
    location: PDF page 4, A(i)
    excerpt: "(i) Positive and negative integers, rational numbers"
  - code: MATH.A.i.i
    parent: MATH.A.i
    type: skill
