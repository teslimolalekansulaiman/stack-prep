# Every check that must pass before main is deployable.
#
# Mirrors the Makefile targets, but against a disposable PostgreSQL service so it
# needs no local cluster. Keep the two in step: if a check only exists here, it
# will not be run before a push.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scorepilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/scorepilot
      DATABASE_SCHEMA: stackprep
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy packages/engine/src apps/api/src

      - name: Apply migrations
        run: |
          for f in database/migrations/*.sql; do
            echo "  $f"
            psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d scorepilot -f "$f"
          done

      - name: Tests
        run: uv run --frozen pytest -q

      - name: Parity vectors are current
        # ADR-0005: a rule change must regenerate packages/fixtures/vectors.json in the
        # same commit, or the TypeScript mirror silently drifts from the Python engine.
        run: |
          uv run --frozen python -m engine.fixtures packages/fixtures/vectors.json
          if ! git diff --quiet -- packages/fixtures/vectors.json; then
            echo "::error file=packages/fixtures/vectors.json::Engine rules changed but the parity vectors were not regenerated. Run 'make fixtures' and commit the result."
            git diff -- packages/fixtures/vectors.json
            exit 1
          fi

  javascript:
    name: JavaScript · types and engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the web client
        run: npm run build

  schema:
    name: Database · schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sp_schema_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration, then the schema assertions
        # The mirror of `make db-test`: the assertions in database/tests are what
        # prove the triggers still refuse content that is not ready for a student.
        run: |
          for f in database/migrations/*.sql database/tests/*.sql; do
            echo "  $f"
            psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U postgres -d sp_schema_test -f "$f"
          done
          echo "Schema tests passed."

  image:
    name: Docker · API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: score-pilot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image can find its migrations
        run: |
          docker run --rm score-pilot-api:ci \
            python -c "from app.migrations import discover; print(f'{len(discover())} migrations visible')"
